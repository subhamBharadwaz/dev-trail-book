<!doctype html>
<html lang="en" class="font-sans scheme-light dark:scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/trailbook.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("trailbook:theme") || "system";
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <title>Dev Trailbook · Your developer field notes</title>
    <meta
      name="description"
      content="A personal developer knowledge base: concepts, code examples, questions, and the details worth remembering."
    />
  </head>
  <body
    class="[--page:#f7f6f2] [--surface:#efeee9] [--surface-hover:#e5e4e0] [--ink:#303340] [--muted-ink:#5c6070] [--line:#cfd0d7] [--green:#4e5691] [--green-soft:#e6e7f2] [--sidebar-bg:#eeede8] [--background:var(--page)] [--foreground:var(--ink)] [--primary:var(--green)] [--primary-foreground:var(--page)] [--border:var(--line)] [--ring:var(--green)] dark:[--page:#232226] dark:[--surface:#2e2c32] dark:[--surface-hover:#3a373f] dark:[--ink:#e6e0da] dark:[--muted-ink:#c0b7c0] dark:[--line:#665d70] dark:[--green:#c5bade] dark:[--green-soft:#40374e] dark:[--sidebar-bg:#29262e] m-0 bg-page text-base text-ink antialiased [&_button]:cursor-pointer [&_button:disabled]:cursor-default [&_svg]:shrink-0 [&_button_svg]:pointer-events-none [&_button:focus-visible]:outline-2 [&_button:focus-visible]:outline-green [&_button:focus-visible]:outline-offset-4 [&_a:focus-visible]:outline-2 [&_a:focus-visible]:outline-green [&_a:focus-visible]:outline-offset-4 [&_input:focus-visible]:outline-2 [&_input:focus-visible]:outline-green [&_input:focus-visible]:outline-offset-4 motion-reduce:[&_*]:transition-none motion-reduce:[&_*]:animate-none"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
